  antialias:true,

world.allowSleep=true;

const matDefault=new CANNON.Material("default");
const matFloor=new CANNON.Material("floor");
world.defaultContactMaterial=new CANNON.ContactMaterial(

world.defaultContactMaterial.friction=.55;
world.defaultContactMaterial.restitution=.12;

const clock=new THREE.Clock();
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

let selected=null;
let grabbedBody=null;
let grabPlane=new THREE.Plane();
let grabOffset=new THREE.Vector3();
let gravityEnabled=true;
let soundEnabled=false;
let audioContext=null;
let masterGain=null;
let alienParts=[];
let alienConstraints=[];
let physicsObjects=[];
let visualObjects=[];
let pulseEffects=[];
let scanEffects=[];
let lastImpactSound=0;
let pointerDown=false;
let activePointerId=null;

const tmpVec=new THREE.Vector3();
const tmpVec2=new THREE.Vector3();

/* ---------------- LIGHTING ---------------- */

scene.add(new THREE.HemisphereLight(0xb8e6ff,0x17202a,1.35));

const mainLight=new THREE.DirectionalLight(0xe2f4ff,2.1);
mainLight.position.set(7,13,8);
mainLight.castShadow=true;
mainLight.shadow.mapSize.set(1024,1024);
mainLight.shadow.camera.left=-18;
mainLight.shadow.camera.right=18;
mainLight.shadow.camera.top=18;
mainLight.shadow.camera.bottom=-18;

const cyanLight=new THREE.PointLight(0x22bfff,32,18,2);
cyanLight.position.set(-7,4,-4);

blueLight.position.set(7,3,5);

/* ---------------- MATERIALS ---------------- */

function physicalMaterial(color,roughness=.6,metalness=.1,extra={}){
  return new THREE.MeshStandardMaterial({
    color,roughness,metalness,...extra
  });
}

const floorMat=physicalMaterial(0x263542,.48,.42);
const wallMat=physicalMaterial(0x344956,.72,.25);
const darkMetal=physicalMaterial(0x111c27,.3,.8);
const silver=physicalMaterial(0x8cabb9,.27,.8);
const glassMat=new THREE.MeshPhysicalMaterial({
  color:0x83dfff,metalness:.05,roughness:.08,
  transmission:.35,transparent:true,opacity:.22,
  thickness:.25,depthWrite:false
});
const glowMat=new THREE.MeshBasicMaterial({color:0x35dfff});

/* ---------------- PHYSICS HELPERS ---------------- */

function addStaticBox(name,x,y,z,sx,sy,sz,material,visible=true){
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),material
  );
  mesh.name=name;
  mesh.position.set(x,y,z);
  mesh.receiveShadow=true;
  mesh.castShadow=true;
  if(visible)scene.add(mesh);

  const body=new CANNON.Body({
    mass:0,
    material:matFloor,
    shape:new CANNON.Box(new CANNON.Vec3(sx/2,sy/2,sz/2))
  });
  body.position.set(x,y,z);
  body.userData={name,staticStage:true};
  world.addBody(body);
  return {mesh,body};
}

function addVisualBox(name,x,y,z,sx,sy,sz,material){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
  mesh.name=name;
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  visualObjects.push(mesh);
  return mesh;
}

/* ---------------- REALISTIC LAB STAGE ---------------- */

function buildLaboratory(){
  // Main room: 22 x 22, ceiling height 8
  addStaticBox("LAB FLOOR",0,-.25,0,22,.5,22,floorMat);
  addStaticBox("NORTH WALL",0,4,-11,22,8,.45,wallMat);
  addStaticBox("SOUTH WALL",0,4,11,22,8,.45,wallMat);
  addStaticBox("WEST WALL",-11,4,0,.45,8,22,wallMat);
  addStaticBox("EAST WALL",11,4,0,.45,8,22,wallMat);
  addStaticBox("CEILING",0,8.25,0,22,.5,22,darkMetal);

  // Floor panels
  for(let x=-10;x<=10;x+=2){
    for(let z=-10;z<=10;z+=2){
      const line=new THREE.Mesh(
        new THREE.BoxGeometry(.025,.012,1.98),
        physicalMaterial(0x526b7a,.5,.35)
      );
      line.position.set(x,.012,z);
      scene.add(line);
    }
  }

  // Wall rails and structural columns
  for(let x=-9;x<=9;x+=3){
    addVisualBox("WALL COLUMN",x,4,-10.72,.13,7.8,.12,darkMetal);
    addVisualBox("WALL COLUMN",x,4,10.72,.13,7.8,.12,darkMetal);
  }

  // Ceiling light strips
  for(let x=-7;x<=7;x+=7){
    const lamp=addVisualBox("CEILING LIGHT",x,7.92,0,3.8,.06,.45,
      new THREE.MeshBasicMaterial({color:0xc9f5ff}));
    const light=new THREE.PointLight(0x9beaff,22,10,2);
    light.position.set(x,7.5,0);
    scene.add(light);
  }

  // Glass containment chamber around the central test area
  const chamberY=2.1;
  addStaticBox("GLASS FRONT",0,chamberY,-4.2,7,4.2,.12,glassMat);
  addStaticBox("GLASS BACK",0,chamberY,4.2,7,4.2,.12,glassMat);
  addStaticBox("GLASS LEFT",-3.5,chamberY,0,.12,4.2,8.4,glassMat);
  addStaticBox("GLASS RIGHT",3.5,chamberY,0,.12,4.2,8.4,glassMat);

  // Chamber metal frame
  for(const x of [-3.55,3.55]){
    for(const z of [-4.25,4.25]){
      addVisualBox("CHAMBER FRAME",x,2.1,z,.16,4.4,.16,silver);
    }
  }
  addVisualBox("CHAMBER TOP FRAME",0,4.3,0,7.2,.16,8.6,silver);
  addVisualBox("CHAMBER BASE FRAME",0,.08,0,7.2,.16,8.6,silver);

  // Laboratory work benches
  for(const z of [-8.3,8.3]){
    addStaticBox("WORK BENCH",0,1.05,z,8,.25,1.2,darkMetal);
    for(const x of [-3.5,3.5]){
      addStaticBox("BENCH LEG",x,.5,z,.18,1,.18,silver);
    }
  }

  // Monitors
  for(const x of [-2.5,0,2.5]){
    const screen=addVisualBox("LAB MONITOR",x,2.15,-8.65,1.65,1,.12,
      new THREE.MeshStandardMaterial({
        color:0x061827,emissive:0x087da8,emissiveIntensity:1.2,
        metalness:.4,roughness:.25
      }));
    const stand=addVisualBox("MONITOR STAND",x,1.55,-8.65,.15,.25,.15,silver);
  }

  // Pipes along the walls
  function pipe(a,b,r,color=0x5e8294){
    const start=new THREE.Vector3(...a);
    const end=new THREE.Vector3(...b);
    const dir=end.clone().sub(start);
    const mesh=new THREE.Mesh(
      new THREE.CylinderGeometry(r,r,dir.length(),12),
      physicalMaterial(color,.32,.8)
    );
    mesh.position.copy(start).add(end).multiplyScalar(.5);
    mesh.quaternion.setFromUnitVectors(
      new THREE.Vector3(0,1,0),dir.normalize()
    );
    mesh.castShadow=true;
    scene.add(mesh);
  }
  pipe([-10,6,-9],[10,6,-9],.12);
  pipe([-10,5.5,9],[10,5.5,9],.09);
  pipe([-9,6,-9],[-9,6,9],.1);
  pipe([9,6,-9],[9,6,9],.1);

  for(let i=-3;i<=3;i++){
    addVisualBox("FLOOR WARNING STRIPE",i,.025,-4.65,.42,.018,.08,
      new THREE.MeshBasicMaterial({color:i%2===0?0xffc247:0x17232b}));
    addVisualBox("FLOOR WARNING STRIPE",i,.025,4.65,.42,.018,.08,

    const strip=addVisualBox("FLOOR LED",x,.035,-10.45,1.2,.025,.08,glowMat);
  }
}

buildLaboratory();
/* =========================================================
   SOUND SYSTEM
========================================================= */

function enableSound(){
  if(soundEnabled)return;
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx){
    hintEl.textContent="このブラウザではサウンドを利用できません";
    return;
  }
  audioContext=new AudioCtx();
  masterGain=audioContext.createGain();
  masterGain.gain.value=.35;
  masterGain.connect(audioContext.destination);
  soundEnabled=true;
  document.getElementById("soundButton").textContent="🔊 サウンド ON";
  startAmbientSound();
}

function tone(freq,duration=.12,type="sine",volume=.2,slide=0){
  if(!soundEnabled||!audioContext)return;
  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();
  const now=audioContext.currentTime;
  osc.type=type;
  osc.frequency.setValueAtTime(freq,now);
  if(slide)osc.frequency.exponentialRampToValueAtTime(
    Math.max(20,freq+slide),now+duration
  );
  gain.gain.setValueAtTime(volume,now);
  gain.gain.exponentialRampToValueAtTime(.001,now+duration);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(now);
  osc.stop(now+duration);
}

function noiseBurst(duration=.18,volume=.15,frequency=700){
  if(!soundEnabled||!audioContext)return;
  const length=Math.floor(audioContext.sampleRate*duration);
  const buffer=audioContext.createBuffer(1,length,audioContext.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<length;i++){
    data[i]=(Math.random()*2-1)*(1-i/length);
  }
  const source=audioContext.createBufferSource();
  const filter=audioContext.createBiquadFilter();
  const gain=audioContext.createGain();
  source.buffer=buffer;
  filter.type="lowpass";
  filter.frequency.value=frequency;
  gain.gain.value=volume;
  source.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  source.start();
}

function playSound(type){
  if(!soundEnabled)return;
  switch(type){
    case "pickup":
      tone(440,.08,"sine",.13,280);
      tone(760,.12,"sine",.1,180);
      break;
    case "pulse":
      tone(100,.5,"sawtooth",.3,900);
      tone(55,.65,"sine",.3,450);
      noiseBurst(.35,.22,1200);
      break;
    case "impact":
      noiseBurst(.12,.12,350);
      tone(75,.16,"sine",.13,-35);
      break;
    case "detach":
      tone(190,.2,"square",.13,-100);
      noiseBurst(.15,.1,900);
      break;
    case "scan":
      tone(550,.12,"sine",.12,300);
      tone(850,.15,"sine",.1,-250);
      break;
    case "throw":
      noiseBurst(.2,.16,1800);
      tone(160,.18,"sawtooth",.1,500);
      break;
    case "alien":
      tone(95,.55,"sawtooth",.1,-40);
      tone(210,.4,"sine",.1,-100);
      break;
  }
}

function startAmbientSound(){
  if(!soundEnabled||!audioContext)return;
  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();
  const filter=audioContext.createBiquadFilter();
  osc.type="sawtooth";
  osc.frequency.value=48;
  filter.type="lowpass";
  filter.frequency.value=110;
  gain.gain.value=.025;
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start();
}

/* =========================================================
   PHYSICS OBJECT CREATION
========================================================= */

function createDynamicObject({
  name="OBJECT",
  position=new THREE.Vector3(0,3,0),
  size=new THREE.Vector3(1,1,1),
  shape="box",
  color=0x91a8b6,
  mass=2,
  metalness=.4,
  roughness=.4
}={}){
  let geometry;
  let physicsShape;

  if(shape==="sphere"){
    const radius=size.x;
    geometry=new THREE.SphereGeometry(radius,24,18);
    physicsShape=new CANNON.Sphere(radius);
  }else{
    geometry=new THREE.BoxGeometry(size.x,size.y,size.z);
    physicsShape=new CANNON.Box(
      new CANNON.Vec3(size.x/2,size.y/2,size.z/2)
    );
  }

  const mesh=new THREE.Mesh(
    geometry,
    physicalMaterial(color,roughness,metalness)
  );
  mesh.name=name;
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  mesh.position.copy(position);
  scene.add(mesh);

  const body=new CANNON.Body({
    mass,
    material:matDefault,
    shape:physicsShape,
    linearDamping:.08,
    angularDamping:.12
  });
  body.position.set(position.x,position.y,position.z);
  body.allowSleep=true;
  body.userData={name,mesh,kind:"object"};
  world.addBody(body);

  const item={body,mesh,name,kind:"object"};
  physicsObjects.push(item);
  return item;
}

/* =========================================================
   ALIEN BODY PARTS
========================================================= */

function makeAlienPart(name,position,geometry,material,shape,mass=1){
  const group=new THREE.Group();
  group.name=name;
  const mesh=new THREE.Mesh(geometry,material);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  group.add(mesh);
  group.position.copy(position);
  scene.add(group);

  const body=new CANNON.Body({
    mass,
    material:matDefault,
    shape,
    linearDamping:.12,
    angularDamping:.18
  });
  body.position.set(position.x,position.y,position.z);
  body.allowSleep=false;
  body.userData={name,kind:"alienPart"};
  world.addBody(body);

  const part={
    name,body,mesh:group,detached:false,
    originalPosition:position.clone()
  };
  alienParts.push(part);
  return part;
}

function capsulePart(name,position,radius,length,mass=1){
  const geometry=new THREE.CapsuleGeometry(radius,length,6,12);
  const shape=new CANNON.Box(
    new CANNON.Vec3(radius,length/2+radius,radius)
  );
  return makeAlienPart(
    name,position,geometry,alienSkin,shape,mass
  );
}

function connectParts(partA,partB,jointWorld){
  const pivotA=new CANNON.Vec3(
    jointWorld.x-partA.body.position.x,
    jointWorld.y-partA.body.position.y,
    jointWorld.z-partA.body.position.z
  );
  const pivotB=new CANNON.Vec3(
    jointWorld.x-partB.body.position.x,
    jointWorld.y-partB.body.position.y,
    jointWorld.z-partB.body.position.z
  );

  const constraint=new CANNON.PointToPointConstraint(
    partA.body,pivotA,partB.body,pivotB,1800
  );
  world.addConstraint(constraint);
  alienConstraints.push({constraint,a:partA,b:partB});
}

/* =========================================================
   CREATE FULL HUMANOID GREY ALIEN
========================================================= */

function createAlien(){
  clearAlien();

  const parts={};

  // Main body
  parts.pelvis=makeAlienPart(
    "PELVIS",new THREE.Vector3(0,1.15,0),
    new THREE.SphereGeometry(.43,24,18),
    alienSkin,
    new CANNON.Box(new CANNON.Vec3(.34,.25,.24)),3
  );

  parts.torso=makeAlienPart(
    "TORSO",new THREE.Vector3(0,2.05,0),
    new THREE.CapsuleGeometry(.48,.75,8,18),
    alienSkinLight,
    new CANNON.Box(new CANNON.Vec3(.43,.75,.3)),5
  );

  parts.head=makeAlienPart(
    "HEAD",new THREE.Vector3(0,3.35,0),
    new THREE.SphereGeometry(.72,32,24),
    alienSkinLight,
    new CANNON.Sphere(.65),2
  );
  buildAlienFace(parts.head.mesh);

  // Neck
  parts.neck=capsulePart(
    "NECK",new THREE.Vector3(0,2.85,0),.19,.35,.6
  );

  // Arms
  for(const side of [-1,1]){
    const label=side<0?"LEFT":"RIGHT";
    const shoulderX=side*.62;

    parts[label+"_UPPER_ARM"]=capsulePart(
      label+" UPPER ARM",
      new THREE.Vector3(side*.78,2.15,0),.19,.62,1
    );
    parts[label+"_LOWER_ARM"]=capsulePart(
      label+" LOWER ARM",
      new THREE.Vector3(side*1.02,1.48,0),.145,.58,.8
    );
    parts[label+"_HAND"]=makeAlienPart(
      label+" HAND",
      new THREE.Vector3(side*1.05,1.02,.02),
      new THREE.SphereGeometry(.19,16,12),
      alienSkin,
      new CANNON.Sphere(.17),.45
    );

    // Fingers as visual details on hand
    for(let i=0;i<4;i++){
      const finger=new THREE.Mesh(
        new THREE.CapsuleGeometry(.035,.16,3,7),alienSkinLight
      );
      finger.position.set(
        side*.025+(i-1.5)*.075,-.16,.08
      );
      parts[label+"_HAND"].mesh.add(finger);
    }

    // Legs
    parts[label+"_THIGH"]=capsulePart(
      label+" THIGH",
      new THREE.Vector3(side*.25,.63,0),.23,.55,1.6
    );
    parts[label+"_SHIN"]=capsulePart(
      label+" SHIN",
      new THREE.Vector3(side*.25,.18,0),.16,.42,1.1
    );
    parts[label+"_FOOT"]=makeAlienPart(
      label+" FOOT",
      new THREE.Vector3(side*.25,.08,.18),
      new THREE.BoxGeometry(.32,.15,.52),
      alienSkin,
      new CANNON.Box(new CANNON.Vec3(.16,.075,.26)),.6
    );
  }

  // Connect skeleton joints
  connectParts(parts.pelvis,parts.torso,new THREE.Vector3(0,1.55,0));
  connectParts(parts.torso,parts.neck,new THREE.Vector3(0,2.72,0));
  connectParts(parts.neck,parts.head,new THREE.Vector3(0,3.05,0));

  for(const side of [-1,1]){
    const label=side<0?"LEFT":"RIGHT";

    connectParts(parts.torso,parts[label+"_UPPER_ARM"],
      new THREE.Vector3(side*.48,2.42,0));
    connectParts(parts[label+"_UPPER_ARM"],parts[label+"_LOWER_ARM"],
      new THREE.Vector3(side*.91,1.82,0));
    connectParts(parts[label+"_LOWER_ARM"],parts[label+"_HAND"],
      new THREE.Vector3(side*1.04,1.2,0));

    connectParts(parts.pelvis,parts[label+"_THIGH"],
      new THREE.Vector3(side*.23,.95,0));
    connectParts(parts[label+"_THIGH"],parts[label+"_SHIN"],
      new THREE.Vector3(side*.25,.39,0));
    connectParts(parts[label+"_SHIN"],parts[label+"_FOOT"],
      new THREE.Vector3(side*.25,.12,.06));
  }

  playSound("alien");
  statusEl.textContent="ALIEN CREATED";
  hintEl.textContent="エイリアンをつかんで動かせるよ";
}

function clearAlien(){
  for(const item of alienConstraints){
    world.removeConstraint(item.constraint);
  }
  alienConstraints=[];

  for(const part of alienParts){
    world.removeBody(part.body);
    scene.remove(part.mesh);
    part.mesh.traverse(obj=>{
      if(obj.geometry)obj.geometry.dispose();
    });
  }
  alienParts=[];
  selected=null;
  grabbedBody=null;
}

   SANDBOX OBJECTS

/* =========================================================
   SELECTION AND RAYCAST
========================================================= */

function updatePointer(event){
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
}

function getTargetFromHit(hitObject){
  let current=hitObject;

  while(current&&current!==scene){
    const alien=alienParts.find(p=>p.mesh===current);
    if(alien)return alien;

    const object=physicsObjects.find(p=>p.mesh===current);
    if(object)return object;

    current=current.parent;
  }
  return null;
}

function getHitTarget(){
  raycaster.setFromCamera(pointer,camera);

  const meshes=[];
  for(const part of alienParts){
    if(!part.detached||part.body){
      meshes.push(part.mesh);
    }
  }
  for(const item of physicsObjects){
    meshes.push(item.mesh);
  }

  const hits=raycaster.intersectObjects(meshes,true);
  if(!hits.length)return null;

  const target=getTargetFromHit(hits[0].object);
  if(!target)return null;

  return {
    target,
    point:hits[0].point.clone(),
    distance:hits[0].distance
  };
}

function setStatus(message){
  statusEl.textContent=message;
}

/* =========================================================
   GRAB / MOVE
========================================================= */

function beginGrab(target,point){
  if(!target||!target.body)return;

  selected=target;
  grabbedBody=target.body;
  grabbedBody.wakeUp();

  grabbedBody.userData.originalMass=grabbedBody.mass;
  grabbedBody.userData.originalType=grabbedBody.type;

  grabPlane.setFromNormalAndCoplanarPoint(
    camera.getWorldDirection(new THREE.Vector3()),
    point
  );

  const intersection=new THREE.Vector3();
  raycaster.ray.intersectPlane(grabPlane,intersection);
  grabOffset.set(
    grabbedBody.position.x-intersection.x,
    grabbedBody.position.y-intersection.y,
    grabbedBody.position.z-intersection.z
  );

  grabbedBody.type=CANNON.Body.KINEMATIC;
  grabbedBody.updateMassProperties();
  grabbedBody.velocity.setZero();
  grabbedBody.angularVelocity.setZero();

  controls.enabled=false;
  setStatus("GRABBING: "+target.name);
}

function moveGrabbed(){
  if(!grabbedBody)return;

  raycaster.setFromCamera(pointer,camera);
  const intersection=new THREE.Vector3();

  if(raycaster.ray.intersectPlane(grabPlane,intersection)){
    const p=intersection.add(grabOffset);
    grabbedBody.position.set(p.x,p.y,p.z);
    grabbedBody.velocity.setZero();
    grabbedBody.angularVelocity.setZero();
  }
}

function endGrab(){
  if(!grabbedBody)return;

  const body=grabbedBody;
  const originalMass=body.userData.originalMass||1;

  body.type=CANNON.Body.DYNAMIC;
  body.mass=originalMass;
  body.updateMassProperties();
  body.wakeUp();

  grabbedBody=null;
  controls.enabled=true;
  setStatus("OBJECT RELEASED");
}

/* =========================================================
   ALIEN PART DETACHMENT
========================================================= */

function detachPart(target){
  if(!target||!target.body||target.kind!=="alienPart"){
    hintEl.textContent="エイリアンのパーツを選択してね";
    return;
  }

  if(target.detached){
    hintEl.textContent="このパーツはすでに分離されています";
    return;
  }

  for(let i=alienConstraints.length-1;i>=0;i--){
    const item=alienConstraints[i];
    if(item.a===target||item.b===target){
      world.removeConstraint(item.constraint);
      alienConstraints.splice(i,1);
    }
  }

  target.detached=true;
  target.body.wakeUp();
  target.body.velocity.set(
    (Math.random()-.5)*2,
    1.5,
    (Math.random()-.5)*2
  );

  playSound("detach");
  setStatus("PART DETACHED: "+target.name);
  hintEl.textContent=target.name+" を分離した";
}

/* =========================================================
   POWERFUL ENERGY PULSE
========================================================= */

function createPulseVisual(position){
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.35,.055,8,48),
    new THREE.MeshBasicMaterial({
      color:0x47eaff,
      transparent:true,
      opacity:.95
    })
  );
  ring.position.copy(position);
  ring.rotation.x=Math.PI/2;
  scene.add(ring);

  pulseEffects.push({
    mesh:ring,
    age:0,
    duration:.75
  });

  const flash=new THREE.PointLight(0x27cfff,30,12,2);
  flash.position.copy(position);
  scene.add(flash);

  pulseEffects.push({
    mesh:flash,
    age:0,
    duration:.3,
    light:true
  });
}

function energyPulse(point){
  const center=point||new THREE.Vector3(0,2,0);
  const radius=9;
  const strength=75;

  createPulseVisual(center);
  playSound("pulse");

  const allBodies=[
    ...alienParts.map(p=>p.body),
    ...physicsObjects.map(p=>p.body)
  ];

  for(const body of allBodies){
    if(body.type!==CANNON.Body.DYNAMIC)continue;

    const dx=body.position.x-center.x;
    const dy=body.position.y-center.y;
    const dz=body.position.z-center.z;
    const distance=Math.sqrt(dx*dx+dy*dy+dz*dz);

    if(distance>radius||distance<.001)continue;

    const falloff=1-distance/radius;
    const direction=new CANNON.Vec3(
      dx/distance,
      dy/distance+.25,
      dz/distance
    );
    const impulse=direction.scale(strength*falloff*body.mass*.7);

    body.applyImpulse(impulse,body.position);
    body.wakeUp();
  }

  setStatus("ENERGY PULSE: MAXIMUM");
  hintEl.textContent="エネルギーパルス発射！";
}

/* =========================================================
   THROW
========================================================= */

function throwTarget(target){
  if(!target||!target.body)return;

  if(target.kind==="alienPart"&&!target.detached){
    detachPart(target);
  }

  const body=target.body;
  body.type=CANNON.Body.DYNAMIC;
  body.mass=body.userData.originalMass||body.mass||1;
  body.updateMassProperties();

  const direction=new THREE.Vector3();
  camera.getWorldDirection(direction);

  const impulse=new CANNON.Vec3(
    direction.x*body.mass*34,
    direction.y*body.mass*34,
    direction.z*body.mass*34
  );

  body.applyImpulse(impulse,body.position);
  body.wakeUp();

  playSound("throw");
  setStatus("THROWN: "+target.name);
}

/* =========================================================
   SCAN
========================================================= */

function scanTarget(target,point){
  if(!target){
    hintEl.textContent="スキャンする物体を選択してね";
    return;
  }

  const body=target.body;
  const mass=body.mass.toFixed(2);
  const speed=body.velocity.length().toFixed(2);

  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.65,.025,8,40),
    new THREE.MeshBasicMaterial({
      color:0x40eaff,
      transparent:true,
      opacity:.9
    })
  );
  ring.position.copy(point||target.mesh.position);
  scene.add(ring);

  scanEffects.push({mesh:ring,age:0});

  hintEl.textContent=
    target.name+" / 質量 "+mass+" / 速度 "+speed;

  playSound("scan");
  setStatus("SCANNING: "+target.name);
}

/* =========================================================
   TOOL ACTION
========================================================= */

function useTool(hit){
  if(!hit){
    if(currentTool==="pulse"){
      const direction=new THREE.Vector3();
      camera.getWorldDirection(direction);
      const point=camera.position.clone().add(direction.multiplyScalar(5));
      energyPulse(point);
    }
    return;
  }

  const target=hit.target;
  selected=target;

  switch(currentTool){
    case "grab":
      beginGrab(target,hit.point);
      break;

    case "pulse":
      energyPulse(hit.point);
      break;

    case "detach":
      detachPart(target);
      break;

    case "scan":
      scanTarget(target,hit.point);
      break;

    case "throw":
      throwTarget(target);
      break;
  }
}

/* =========================================================
   POINTER INPUT - PC AND MOBILE
========================================================= */

renderer.domElement.addEventListener("pointerdown",event=>{
  if(event.button!==undefined&&event.button!==0)return;

  event.preventDefault();
  updatePointer(event);
  pointerDown=true;
  activePointerId=event.pointerId;

  const hit=getHitTarget();
  useTool(hit);

  try{
    renderer.domElement.setPointerCapture(event.pointerId);
  }catch(e){}
});

renderer.domElement.addEventListener("pointermove",event=>{
  updatePointer(event);
  if(grabbedBody){
    event.preventDefault();
    moveGrabbed();
  }
});

function finishPointer(event){
  if(!pointerDown)return;
  pointerDown=false;

  if(grabbedBody)endGrab();

  if(activePointerId!==null){
    try{
      renderer.domElement.releasePointerCapture(activePointerId);
    }catch(e){}
  }
  activePointerId=null;
}

renderer.domElement.addEventListener("pointerup",finishPointer);
renderer.domElement.addEventListener("pointercancel",finishPointer);
window.addEventListener("blur",()=>{
  if(grabbedBody)endGrab();
});

/* =========================================================
   TOOLBAR
========================================================= */

document.querySelectorAll(".tool").forEach(button=>{
  button.addEventListener("click",()=>{
    if(grabbedBody)endGrab();

    currentTool=button.dataset.tool;

    document.querySelectorAll(".tool").forEach(b=>{
      b.classList.toggle("active",b===button);
    });

    const labels={
      grab:"オブジェクトをつかんで移動",
      pulse:"クリックした場所に強力パルス",
      detach:"エイリアンのパーツを選択して分離",
      scan:"対象の物理情報をスキャン",
      throw:"選択した物体を前方へ投げる"
    };

    hintEl.textContent=labels[currentTool];
    setStatus("TOOL: "+currentTool.toUpperCase());
  });
});

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById("soundButton").addEventListener("click",()=>{
  if(!soundEnabled){
    enableSound();
  }else{
    soundEnabled=false;
    document.getElementById("soundButton").textContent="🔇 サウンド OFF";
  }
});

document.getElementById("newAlien").addEventListener("click",()=>{

});

document.getElementById("addBox").addEventListener("click",()=>{

});

document.getElementById("addBall").addEventListener("click",()=>{

});

document.getElementById("gravityButton").addEventListener("click",()=>{
  gravityEnabled=!gravityEnabled;
  world.gravity.set(0,gravityEnabled?-9.82:0,0);

  document.getElementById("gravityButton").textContent=
    "重力："+(gravityEnabled?"ON":"OFF");

  setStatus("GRAVITY: "+(gravityEnabled?"ON":"OFF"));
});

function clearPhysicsObjects(){
  for(const item of physicsObjects){
    world.removeBody(item.body);
    scene.remove(item.mesh);
    item.mesh.geometry.dispose();
    if(item.mesh.material)item.mesh.material.dispose();
  }
  physicsObjects=[];
}

document.getElementById("resetButton").addEventListener("click",()=>{
  if(grabbedBody)endGrab();

  clearPhysicsObjects();
  createAlien();

  gravityEnabled=true;
  world.gravity.set(0,-9.82,0);
  document.getElementById("gravityButton").textContent="重力：ON";

  camera.position.set(10,8,13);
  controls.target.set(0,2,0);
  controls.update();

  hintEl.textContent="ステージをリセットしました";
  setStatus("SYSTEM RESET");
});

/* =========================================================
   COLLISION SOUND
========================================================= */

world.addEventListener("beginContact",event=>{
  const now=performance.now();
  if(now-lastImpactSound<130)return;
  lastImpactSound=now;

  const bodyA=event.bodyA;
  const bodyB=event.bodyB;

  const speedA=bodyA.velocity?bodyA.velocity.length():0;
  const speedB=bodyB.velocity?bodyB.velocity.length():0;

  if(Math.max(speedA,speedB)>3){
    playSound("impact");
  }
});

/* =========================================================
   EFFECT UPDATES
========================================================= */

function updateEffects(delta){
  for(let i=pulseEffects.length-1;i>=0;i--){
    const effect=pulseEffects[i];
    effect.age+=delta;

    const t=Math.min(effect.age/effect.duration,1);

    if(effect.light){
      effect.mesh.intensity=30*(1-t);
    }else{
      const scale=1+t*13;
      effect.mesh.scale.setScalar(scale);
      effect.mesh.material.opacity=1-t;
    }

    if(t>=1){
      scene.remove(effect.mesh);
      if(effect.mesh.geometry)effect.mesh.geometry.dispose();
      if(effect.mesh.material)effect.mesh.material.dispose();
      pulseEffects.splice(i,1);
    }
  }

  for(let i=scanEffects.length-1;i>=0;i--){
    const effect=scanEffects[i];
    effect.age+=delta;

    const t=Math.min(effect.age/.8,1);
    effect.mesh.scale.setScalar(1+t*2.5);
    effect.mesh.material.opacity=1-t;

    if(t>=1){
      scene.remove(effect.mesh);
      effect.mesh.geometry.dispose();
      effect.mesh.material.dispose();
      scanEffects.splice(i,1);
    }
  }
}

/* =========================================================
   PHYSICS -> THREE SYNC
========================================================= */

function syncPhysics(){
  for(const part of alienParts){
    part.mesh.position.set(
      part.body.position.x,
      part.body.position.y,
      part.body.position.z
    );
    part.mesh.quaternion.set(
      part.body.quaternion.x,
      part.body.quaternion.y,
      part.body.quaternion.z,
      part.body.quaternion.w
    );
  }

  for(const item of physicsObjects){
    item.mesh.position.set(
      item.body.position.x,
      item.body.position.y,
      item.body.position.z
    );
    item.mesh.quaternion.set(
      item.body.quaternion.x,
      item.body.quaternion.y,
      item.body.quaternion.z,
      item.body.quaternion.w
    );
  }
}

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
});

/* =========================================================
   START GAME
========================================================= */

createAlien();

let accumulator=0;
const fixedTimeStep=1/60;

function animate(){
  requestAnimationFrame(animate);

  const delta=Math.min(clock.getDelta(),.05);

  if(!grabbedBody){
    accumulator+=delta;
    while(accumulator>=fixedTimeStep){
      world.step(fixedTimeStep);
      accumulator-=fixedTimeStep;
    }
  }else{
    world.step(fixedTimeStep);
  }

  syncPhysics();
  updateEffects(delta);
  controls.update();

  renderer.render(scene,camera);
}

animate();

setStatus("SYSTEM ONLINE");
hintEl.textContent="オブジェクトを選択して操作しよう";

</script>
