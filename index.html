function addStaticBox(name,x,y,z,sx,sy,sz,material){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(sx,sy,sz),material
 );
 mesh.name=name;
 mesh.position.set(x,y,z);
 mesh.receiveShadow=true;
 mesh.castShadow=true;
 scene.add(mesh);

 const body=new CANNON.Body({
  mass:0,
  material:matFloor,
  shape:new CANNON.Box(new CANNON.Vec3(sx/2,sy/2,sz/2))
 });
 body.position.set(x,y,z);
 body.userData={name,stage:true};
 world.addBody(body);

 return {mesh,body};
}

function addVisualBox(name,x,y,z,sx,sy,sz,material){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(sx,sy,sz),material
 );
 mesh.name=name;
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 visualObjects.push(mesh);

}

 grid.position.y=.015;
 scene.add(grid);

 // Main test platform
 addStaticBox("TEST PLATFORM",0,.15,0,22,.3,22,darkMetal);

 // Glass containment chamber
 const C=14;
 const CY=2.5;
 const CH=5;

 addStaticBox("GLASS FRONT",0,CY,-C/2,C,CH,.18,glassMat);
 addStaticBox("GLASS BACK",0,CY,C/2,C,CH,.18,glassMat);
 addStaticBox("GLASS LEFT",-C/2,CY,0,.18,CH,C,glassMat);
 addStaticBox("GLASS RIGHT",C/2,CY,0,.18,CH,C,glassMat);

 for(const x of [-C/2,C/2]){
  for(const z of [-C/2,C/2]){
   addVisualBox("CHAMBER FRAME",x,CY,z,.22,CH+.3,.22,metal);
  }
 }

 addVisualBox("CHAMBER TOP",0,5.1,0,C+.3,.22,C+.3,metal);

 // Research benches
 for(const x of [-35,-20,20,35]){

   new THREE.CylinderGeometry(r,r,d.length(),12),metal

  mesh.quaternion.setFromUnitVectors(
   new THREE.Vector3(0,1,0),d.normalize()
  );

 pipe([-110,52,-110],[110,52,-110],.55);

/* =====================================================
   AUDIO
===================================================== */

function enableSound(){
 if(soundEnabled)return;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return;
 audioContext=new AC();
 masterGain=audioContext.createGain();
 masterGain.gain.value=.3;
 masterGain.connect(audioContext.destination);
 soundEnabled=true;
 document.getElementById("sound").textContent="🔊 サウンド ON";
 startAmbient();
}

function tone(freq,duration=.15,type="sine",volume=.15,slide=0){
 if(!soundEnabled)return;
 const osc=audioContext.createOscillator();
 const gain=audioContext.createGain();
 const now=audioContext.currentTime;
 osc.type=type;
 osc.frequency.setValueAtTime(freq,now);
 if(slide)osc.frequency.exponentialRampToValueAtTime(
  Math.max(20,freq+slide),now+duration
 );
 gain.gain.setValueAtTime(volume,now);
 gain.gain.exponentialRampToValueAtTime(.001,now+duration);
 osc.connect(gain);
 gain.connect(masterGain);
 osc.start(now);
 osc.stop(now+duration);
}

function noise(duration=.15,volume=.12){
 if(!soundEnabled)return;
 const length=Math.floor(audioContext.sampleRate*duration);
 const buffer=audioContext.createBuffer(1,length,audioContext.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
 const src=audioContext.createBufferSource();
 const gain=audioContext.createGain();
 src.buffer=buffer;
 gain.gain.value=volume;
 src.connect(gain);
 gain.connect(masterGain);
 src.start();
}

function playSound(type){
 if(!soundEnabled)return;
 if(type==="pulse"){
  tone(75,.55,"sawtooth",.3,950);
  tone(45,.7,"sine",.25,500);
  noise(.35,.2);
 }else if(type==="detach"){
  tone(180,.22,"square",.16,-100);
  noise(.15,.1);
 }else if(type==="impact"){
  tone(70,.16,"sine",.13,-30);
  noise(.1,.1);
 }else if(type==="scan"){
  tone(500,.12,"sine",.12,350);
  tone(850,.16,"sine",.1,-250);
 }else if(type==="throw"){
  tone(130,.2,"sawtooth",.13,500);
  noise(.18,.12);
 }else if(type==="pickup"){
  tone(420,.1,"sine",.12,250);
 }else if(type==="alien"){
  tone(90,.5,"sawtooth",.08,-30);
 }
}

function startAmbient(){
 const osc=audioContext.createOscillator();
 const gain=audioContext.createGain();
 const filter=audioContext.createBiquadFilter();
 osc.type="sawtooth";
 osc.frequency.value=48;
 filter.type="lowpass";
 filter.frequency.value=110;
 gain.gain.value=.018;
 osc.connect(filter);
 filter.connect(gain);
 gain.connect(masterGain);
 osc.start();
}

/* =====================================================
   PHYSICS OBJECTS
===================================================== */

function createObject(name,pos,size,shape,color,mass){
 let geometry,collider;

 if(shape==="sphere"){
  geometry=new THREE.SphereGeometry(size.x,24,18);
  collider=new CANNON.Sphere(size.x);
 }else{
  geometry=new THREE.BoxGeometry(size.x,size.y,size.z);
  collider=new CANNON.Box(new CANNON.Vec3(
   size.x/2,size.y/2,size.z/2
  ));
 }

 const mesh=new THREE.Mesh(
  geometry,new THREE.MeshStandardMaterial({
   color,roughness:.35,metalness:.65
  })
 );
 mesh.name=name;
 mesh.position.copy(pos);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);

 const body=new CANNON.Body({
  mass,material:matDefault,shape:collider,
  linearDamping:.08,angularDamping:.12
 });
 body.position.set(pos.x,pos.y,pos.z);
 body.userData={name,kind:"object"};
 world.addBody(body);

 const item={name,mesh,body,kind:"object"};
 physicsObjects.push(item);
 return item;
}

/* =====================================================
   HUMAN-LIKE ALIEN BODY
===================================================== */

function makePart(name,pos,geometry,collider,mass,material=skin){
 const group=new THREE.Group();
 group.name=name;

 const mesh=new THREE.Mesh(geometry,material);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 group.add(mesh);

 group.position.copy(pos);
 scene.add(group);

 const body=new CANNON.Body({
  mass,material:matDefault,shape:collider,
  linearDamping:.12,angularDamping:.18
 });
 body.position.set(pos.x,pos.y,pos.z);
 body.userData={name,kind:"alienPart"};
 world.addBody(body);

 const part={
  name,mesh,body,kind:"alienPart",
  detached:false,originalMass:mass
 };
 alienParts.push(part);
 return part;
}

function makeCapsule(name,pos,radius,length,mass,material=skin){
 return makePart(
  name,pos,
  new THREE.CapsuleGeometry(radius,length,6,14),
  new CANNON.Box(new CANNON.Vec3(
   radius,length/2+radius,radius
  )),
  mass,material
 );
}

function makeSpherePart(name,pos,radius,mass,material=skin){
 return makePart(
  name,pos,
  new THREE.SphereGeometry(radius,24,18),
  new CANNON.Sphere(radius),
  mass,material
 );
}

function makeBoxPart(name,pos,size,mass,material=skin){
 return makePart(
  name,pos,
  new THREE.BoxGeometry(size.x,size.y,size.z),
  new CANNON.Box(new CANNON.Vec3(
   size.x/2,size.y/2,size.z/2
  )),
  mass,material
 );
}

function addJoint(a,b,worldPoint){
 const pa=new CANNON.Vec3(
  worldPoint.x-a.body.position.x,
  worldPoint.y-a.body.position.y,
  worldPoint.z-a.body.position.z
 );
 const pb=new CANNON.Vec3(
  worldPoint.x-b.body.position.x,
  worldPoint.y-b.body.position.y,
  worldPoint.z-b.body.position.z
 );

 const constraint=new CANNON.PointToPointConstraint(
  a.body,pa,b.body,pb,1200
 );
 world.addConstraint(constraint);
 alienConstraints.push({constraint,a,b});
}

function faceDetail(parent,name,pos,scale,material){
 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(1,20,16),material
 );
 mesh.name=name;
 mesh.position.set(pos.x,pos.y,pos.z);
 mesh.scale.set(scale.x,scale.y,scale.z);
 mesh.castShadow=true;
 parent.mesh.add(mesh);
 return mesh;
}

 }

 faceDetail(head,"NOSE BRIDGE",
  new THREE.Vector3(0,-.08,.32),
  new THREE.Vector3(.07,.17,.09),skinLight);

 faceDetail(head,"NOSE TIP",
  new THREE.Vector3(0,-.19,.35),
  new THREE.Vector3(.085,.055,.08),skin);

 for(const s of [-1,1]){

   new THREE.Vector3(s*.045,-.21,.425),

 faceDetail(head,"MOUTH",
  new THREE.Vector3(0,-.29,.30),
  new THREE.Vector3(.105,.025,.025),mouthMat);

 faceDetail(head,"CHIN",

/* =====================================================
   BUILD FULL HUMAN PROPORTION SKELETON
===================================================== */

function clearAlien(){
 if(grabbedBody)endGrab();

 for(const item of alienConstraints){
  world.removeConstraint(item.constraint);
 }
 alienConstraints.length=0;

 for(const part of alienParts){
  world.removeBody(part.body);
  scene.remove(part.mesh);
  part.mesh.traverse(obj=>{
   if(obj.geometry)obj.geometry.dispose();
  });
 }
 alienParts.length=0;
 selected=null;
}

function createAlien(){
 clearAlien();

 const P={};

 // Human proportions: total height approximately 5.1 units
 // Pelvis
 P.pelvis=makeSpherePart(
  "PELVIS",new THREE.Vector3(0,1.05,0),.32,3,skin
 );

 // Abdomen
 P.abdomen=makeCapsule(
  "ABDOMEN",new THREE.Vector3(0,1.48,0),.27,.35,2,skin
 );

 // Chest
 P.chest=makeCapsule(
  "CHEST",new THREE.Vector3(0,2.12,0),.39,.55,4,skinLight
 );

 // Neck
 P.neck=makeCapsule(
  "NECK",new THREE.Vector3(0,2.72,0),.13,.18,.7,skin
 );

 // Head
 P.head=makeSpherePart(
  "HEAD",new THREE.Vector3(0,3.27,0),.34,1.5,skinLight
 );
 buildFace(P.head);

 // Shoulders, arms, hands, fingers
 for(const s of [-1,1]){
  const side=s<0?"LEFT":"RIGHT";

  P[side+"_SHOULDER"]=makeSpherePart(
   side+" SHOULDER",
   new THREE.Vector3(s*.48,2.42,0),.19,.8,skin
  );

  P[side+"_UPPER_ARM"]=makeCapsule(
   side+" UPPER ARM",
   new THREE.Vector3(s*.57,1.99,0),.135,.42,1.2,skin
  );

  P[side+"_ELBOW"]=makeSpherePart(
   side+" ELBOW",
   new THREE.Vector3(s*.57,1.69,0),.12,.5,skin
  );

  P[side+"_FOREARM"]=makeCapsule(
   side+" FOREARM",
   new THREE.Vector3(s*.57,1.36,0),.105,.38,.8,skin
  );

  P[side+"_HAND"]=makeBoxPart(
   side+" HAND",
   new THREE.Vector3(s*.57,1.05,.015),
   new THREE.Vector3(.19,.24,.09),.45,skinLight
  );

  // Four fingers and thumb are attached to the hand
  for(let i=0;i<4;i++){
   const finger=new THREE.Mesh(
    new THREE.CapsuleGeometry(.025,.12,3,7),skinLight
   );
   finger.position.set(
    (i-1.5)*.047,-.17,.015
   );
   P[side+"_HAND"].mesh.add(finger);
  }

  const thumb=new THREE.Mesh(
   new THREE.CapsuleGeometry(.03,.09,3,7),skinLight
  );
  thumb.position.set(s*.12,-.07,.025);
  thumb.rotation.z=s*.7;
  P[side+"_HAND"].mesh.add(thumb);

  // Thighs
  P[side+"_THIGH"]=makeCapsule(
   side+" THIGH",
   new THREE.Vector3(s*.19,.69,0),.17,.43,1.8,skin
  );

  P[side+"_KNEE"]=makeSpherePart(
   side+" KNEE",
   new THREE.Vector3(s*.19,.39,0),.13,.5,skin
  );

  P[side+"_CALF"]=makeCapsule(
   side+" CALF",
   new THREE.Vector3(s*.19,.16,0),.115,.25,1.1,skin
  );

  P[side+"_FOOT"]=makeBoxPart(
   side+" FOOT",
   new THREE.Vector3(s*.19,.055,.13),
   new THREE.Vector3(.22,.12,.38),.65,skinLight
  );
 }

 // Central torso joints
 addJoint(P.pelvis,P.abdomen,new THREE.Vector3(0,1.25,0));
 addJoint(P.abdomen,P.chest,new THREE.Vector3(0,1.78,0));
 addJoint(P.chest,P.neck,new THREE.Vector3(0,2.58,0));
 addJoint(P.neck,P.head,new THREE.Vector3(0,2.94,0));

 // Arm joints
 for(const s of [-1,1]){
  const side=s<0?"LEFT":"RIGHT";

  addJoint(P.chest,P[side+"_SHOULDER"],
   new THREE.Vector3(s*.42,2.38,0));

  addJoint(P[side+"_SHOULDER"],P[side+"_UPPER_ARM"],
   new THREE.Vector3(s*.57,2.2,0));

  addJoint(P[side+"_UPPER_ARM"],P[side+"_ELBOW"],
   new THREE.Vector3(s*.57,1.75,0));

  addJoint(P[side+"_ELBOW"],P[side+"_FOREARM"],
   new THREE.Vector3(s*.57,1.55,0));

  addJoint(P[side+"_FOREARM"],P[side+"_HAND"],
   new THREE.Vector3(s*.57,1.18,0));

  // Leg joints
  addJoint(P.pelvis,P[side+"_THIGH"],
   new THREE.Vector3(s*.19,.92,0));

  addJoint(P[side+"_THIGH"],P[side+"_KNEE"],
   new THREE.Vector3(s*.19,.43,0));

  addJoint(P[side+"_KNEE"],P[side+"_CALF"],
   new THREE.Vector3(s*.19,.29,0));

  addJoint(P[side+"_CALF"],P[side+"_FOOT"],
   new THREE.Vector3(s*.19,.09,.05));
 }

 playSound("alien");
 statusEl.textContent="HUMANOID ALIEN CREATED";
 hintEl.textContent="人型エイリアンを作成しました";
}

/* =====================================================
   RELIABLE DETACH SYSTEM
===================================================== */

function detachPart(part){
 if(!part||part.kind!=="alienPart"){
  hintEl.textContent="エイリアンのパーツを選択してね";
  return;
 }

 if(part.detached){
  hintEl.textContent="このパーツはすでに分離されています";
  return;
 }

 // Remove every joint connected to this part
 for(let i=alienConstraints.length-1;i>=0;i--){
  const joint=alienConstraints[i];

  if(joint.a===part||joint.b===part){
   world.removeConstraint(joint.constraint);
   alienConstraints.splice(i,1);
  }
 }

 // The part remains a separate physical body
 part.detached=true;
 part.body.type=CANNON.Body.DYNAMIC;
 part.body.mass=part.originalMass;
 part.body.updateMassProperties();
 part.body.wakeUp();

 // Small separation impulse
 part.body.applyImpulse(
  new CANNON.Vec3(
   (Math.random()-.5)*2,
   1.8,
   (Math.random()-.5)*2
  ),
  part.body.position
 );

 playSound("detach");
 statusEl.textContent="PART DETACHED: "+part.name;
 hintEl.textContent=part.name+" を分離しました";
}

/* =====================================================
   TARGET DETECTION
===================================================== */

function updatePointer(event){
 const rect=renderer.domElement.getBoundingClientRect();
 pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
}

function findTarget(object){
 let current=object;

 while(current&&current!==scene){
  const alien=alienParts.find(p=>p.mesh===current);
  if(alien)return alien;

  const prop=physicsObjects.find(p=>p.mesh===current);
  if(prop)return prop;

  current=current.parent;
 }

 return null;
}

function getHit(){
 raycaster.setFromCamera(pointer,camera);

 const meshes=[
  ...alienParts.map(p=>p.mesh),
  ...physicsObjects.map(p=>p.mesh)
 ];

 const hits=raycaster.intersectObjects(meshes,true);
 if(!hits.length)return null;

 const target=findTarget(hits[0].object);
 if(!target)return null;

 return {target,point:hits[0].point.clone()};
}

/* =====================================================
   PHYSICS GRAB
===================================================== */

function beginGrab(target,point){
 if(!target||!target.body)return;

 selected=target;
 grabbedBody=target.body;
 grabbedBody.wakeUp();

 grabDistance=camera.position.distanceTo(point);

 grabAnchor=new CANNON.Body({
  mass:0,
  type:CANNON.Body.KINEMATIC,
  shape:new CANNON.Sphere(.12),
  collisionFilterGroup:0,
  collisionFilterMask:0
 });
 grabAnchor.position.set(point.x,point.y,point.z);
 world.addBody(grabAnchor);

 const pivot=new CANNON.Vec3(
  point.x-grabbedBody.position.x,
  point.y-grabbedBody.position.y,
  point.z-grabbedBody.position.z
 );

 grabConstraint=new CANNON.PointToPointConstraint(
  grabbedBody,pivot,grabAnchor,
  new CANNON.Vec3(0,0,0),1000
 );
 world.addConstraint(grabConstraint);

 controls.enabled=false;
 statusEl.textContent="GRABBING: "+target.name;
}

function moveGrabbed(){
 if(!grabbedBody||!grabAnchor)return;

 raycaster.setFromCamera(pointer,camera);
 const p=camera.position.clone().add(
  raycaster.ray.direction.clone().multiplyScalar(grabDistance)
 );

 grabAnchor.position.set(p.x,p.y,p.z);
 grabAnchor.velocity.setZero();
 grabAnchor.angularVelocity.setZero();
 grabAnchor.wakeUp();
}

function endGrab(){
 if(!grabbedBody)return;

 if(grabConstraint){
  world.removeConstraint(grabConstraint);
  grabConstraint=null;
 }

 if(grabAnchor){
  world.removeBody(grabAnchor);
  grabAnchor=null;
 }

 grabbedBody.wakeUp();
 grabbedBody=null;
 controls.enabled=true;
 statusEl.textContent="OBJECT RELEASED";
}

/* =====================================================
   ENERGY PULSE
===================================================== */

function energyPulse(point){
 const center=point||new THREE.Vector3(0,2,0);

 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(.3,.06,8,48),
  new THREE.MeshBasicMaterial({
   color:0x4beaff,transparent:true,opacity:1
  })
 );
 ring.position.copy(center);
 ring.rotation.x=Math.PI/2;
 scene.add(ring);
 pulseEffects.push({mesh:ring,age:0,duration:.8});

 const light=new THREE.PointLight(0x21cfff,35,18,2);
 light.position.copy(center);
 scene.add(light);
 pulseEffects.push({mesh:light,age:0,duration:.3,light:true});

 const bodies=[
  ...alienParts.map(p=>p.body),
  ...physicsObjects.map(p=>p.body)
 ];

 for(const body of bodies){
  if(body.type!==CANNON.Body.DYNAMIC)continue;

  const dx=body.position.x-center.x;
  const dy=body.position.y-center.y;
  const dz=body.position.z-center.z;
  const distance=Math.sqrt(dx*dx+dy*dy+dz*dz);

  if(distance>13||distance<.001)continue;

  const falloff=1-distance/13;
  const direction=new CANNON.Vec3(
   dx/distance,dy/distance+.25,dz/distance
  );

  body.applyImpulse(
   direction.scale(65*falloff*body.mass),
   body.position
  );
  body.wakeUp();
 }

 playSound("pulse");
 statusEl.textContent="ENERGY PULSE: MAXIMUM";
}

/* =====================================================
   THROW
===================================================== */

function throwTarget(target){
 if(!target||!target.body)return;

 if(target.kind==="alienPart"&&!target.detached){
  detachPart(target);
 }

 const body=target.body;
 body.type=CANNON.Body.DYNAMIC;
 body.mass=target.originalMass||body.mass||1;
 body.updateMassProperties();

 const direction=new THREE.Vector3();
 camera.getWorldDirection(direction);

 body.applyImpulse(
  new CANNON.Vec3(
   direction.x*body.mass*30,
   direction.y*body.mass*30,
   direction.z*body.mass*30
  ),
  body.position
 );
 body.wakeUp();

 playSound("throw");
 statusEl.textContent="OBJECT THROWN";
}

/* =====================================================
   SCAN
===================================================== */

function scanTarget(target,point){
 if(!target)return;

 const body=target.body;
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(.65,.025,8,40),
  new THREE.MeshBasicMaterial({
   color:0x45eaff,transparent:true,opacity:1
  })
 );
 ring.position.copy(point);
 scene.add(ring);
 scanEffects.push({mesh:ring,age:0});

 hintEl.textContent=
  target.name+
  " / MASS "+body.mass.toFixed(2)+
  " / SPEED "+body.velocity.length().toFixed(2);

 playSound("scan");
 statusEl.textContent="SCANNING";
}

/* =====================================================
   TOOL ROUTER
===================================================== */

function useTool(hit){
 if(!hit){
  if(currentTool==="pulse"){
   const dir=new THREE.Vector3();
   camera.getWorldDirection(dir);
   energyPulse(camera.position.clone().add(dir.multiplyScalar(6)));
  }
  return;
 }

 const target=hit.target;
 selected=target;

 if(currentTool==="grab")beginGrab(target,hit.point);
 if(currentTool==="pulse")energyPulse(hit.point);
 if(currentTool==="detach")detachPart(target);
 if(currentTool==="scan")scanTarget(target,hit.point);
 if(currentTool==="throw")throwTarget(target);
}

/* =====================================================
   INPUT
===================================================== */

let pointerDown=false;
let pointerId=null;

renderer.domElement.addEventListener("pointerdown",event=>{
 if(event.button!==undefined&&event.button!==0)return;

 updatePointer(event);
 pointerDown=true;
 pointerId=event.pointerId;

 const hit=getHit();
 useTool(hit);

 try{renderer.domElement.setPointerCapture(event.pointerId)}catch(e){}
});

renderer.domElement.addEventListener("pointermove",event=>{
 updatePointer(event);
 if(grabbedBody)moveGrabbed();
});

function finishPointer(event){
 if(!pointerDown)return;
 pointerDown=false;

 if(grabbedBody)endGrab();

 if(pointerId!==null){
  try{renderer.domElement.releasePointerCapture(pointerId)}catch(e){}
 }
 pointerId=null;
}

renderer.domElement.addEventListener("pointerup",finishPointer);
renderer.domElement.addEventListener("pointercancel",finishPointer);
window.addEventListener("blur",()=>{
 if(grabbedBody)endGrab();
});

/* =====================================================
   TOOL BUTTONS
===================================================== */

document.querySelectorAll(".tool").forEach(button=>{
 button.addEventListener("click",()=>{
  if(grabbedBody)endGrab();

  currentTool=button.dataset.tool;

  document.querySelectorAll(".tool").forEach(b=>{
   b.classList.toggle("active",b===button);
  });

  const labels={
   grab:"対象をドラッグして移動",
   pulse:"対象をタップして強力パルス",
   detach:"エイリアンのパーツをタップして分離",
   scan:"対象をタップしてスキャン",
   throw:"対象をタップして投げる"
  };

  hintEl.textContent=labels[currentTool];
  statusEl.textContent="TOOL: "+currentTool.toUpperCase();
 });
});

   BUTTONS

  ),

document.getElementById("gravity").onclick=()=>{

 world.gravity.set(0,gravityEnabled?-9.82:0,0);
 document.getElementById("gravity").textContent=

};

function clearObjects(){
 for(const item of physicsObjects){
  world.removeBody(item.body);
  scene.remove(item.mesh);
  item.mesh.geometry.dispose();
  item.mesh.material.dispose();
 }
 physicsObjects.length=0;
}

document.getElementById("reset").onclick=()=>{
 if(grabbedBody)endGrab();
 clearObjects();
 createAlien();
 gravityEnabled=true;
 world.gravity.set(0,-9.82,0);
 document.getElementById("gravity").textContent="重力：ON";
 camera.position.set(12,8,16);
 controls.target.set(0,2.5,0);
 controls.update();
};

document.getElementById("sound").onclick=()=>{
 if(!soundEnabled)enableSound();
};

/* =====================================================
   COLLISION AUDIO
===================================================== */

world.addEventListener("beginContact",()=>{
 const now=performance.now();
 if(now-lastImpact<160)return;
 lastImpact=now;
 playSound("impact");
});

/* =====================================================
   SYNC
===================================================== */

function syncPhysics(){
 for(const part of alienParts){
  part.mesh.position.set(
   part.body.position.x,
   part.body.position.y,
   part.body.position.z
  );
  part.mesh.quaternion.set(
   part.body.quaternion.x,
   part.body.quaternion.y,
   part.body.quaternion.z,
   part.body.quaternion.w
  );
 }

 for(const item of physicsObjects){
  item.mesh.position.set(
   item.body.position.x,
   item.body.position.y,
   item.body.position.z
  );
  item.mesh.quaternion.set(
   item.body.quaternion.x,
   item.body.quaternion.y,
   item.body.quaternion.z,
   item.body.quaternion.w
  );
 }
}

/* =====================================================
   EFFECTS
===================================================== */

function updateEffects(dt){
 for(let i=pulseEffects.length-1;i>=0;i--){
  const e=pulseEffects[i];
  e.age+=dt;
  const t=Math.min(e.age/e.duration,1);

  if(e.light){
   e.mesh.intensity=35*(1-t);
  }else{
   e.mesh.scale.setScalar(1+t*16);
   e.mesh.material.opacity=1-t;
  }

  if(t>=1){
   scene.remove(e.mesh);
   if(e.mesh.geometry)e.mesh.geometry.dispose();
   if(e.mesh.material)e.mesh.material.dispose();
   pulseEffects.splice(i,1);
  }
 }

 for(let i=scanEffects.length-1;i>=0;i--){
  const e=scanEffects[i];
  e.age+=dt;
  const t=Math.min(e.age/.8,1);
  e.mesh.scale.setScalar(1+t*3);
  e.mesh.material.opacity=1-t;

  if(t>=1){
   scene.remove(e.mesh);
   e.mesh.geometry.dispose();
   e.mesh.material.dispose();
   scanEffects.splice(i,1);
  }
 }
}

/* =====================================================
   SPEED LIMIT
===================================================== */

function limitSpeed(body){
 const speed=body.velocity.length();
 if(speed>35){
  body.velocity.scale(35/speed,body.velocity);
 }
}

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});

/* =====================================================
   START
===================================================== */

buildLaboratory();
createAlien();

let accumulator=0;
const STEP=1/60;

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);
 accumulator+=dt;

 while(accumulator>=STEP){
  world.step(STEP);

  for(const p of alienParts)limitSpeed(p.body);
  for(const p of physicsObjects)limitSpeed(p.body);

  accumulator-=STEP;
 }

 syncPhysics();
 updateEffects(dt);
 controls.update();
 renderer.render(scene,camera);
}

animate();

statusEl.textContent="SYSTEM ONLINE";
hintEl.textContent="ツールを選択してエイリアンを操作しよう";

</script>
