<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ALIEN LAB - Physics Sandbox</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#070d16;color:#eaf5ff;
  font-family:Arial,"Noto Sans JP",sans-serif;
  touch-action:none;
}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#topbar{
  position:fixed;top:12px;left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:center;
  pointer-events:none;z-index:5;gap:8px
}
.panel{
  background:rgba(7,17,29,.82);
  border:1px solid rgba(110,190,230,.3);
  box-shadow:0 4px 22px #0008;
  backdrop-filter:blur(10px);
  border-radius:12px;padding:10px 13px
}
#logo{font-size:17px;font-weight:900;letter-spacing:2px}
#subtitle{font-size:10px;color:#8faabd;margin-top:3px}
#status{font-size:12px;color:#9eeaff;text-align:right}
#toolbar{
  position:fixed;left:50%;bottom:15px;transform:translateX(-50%);
  display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
  width:min(760px,96vw);z-index:10
}
.tool{
  color:#dff5ff;background:rgba(9,24,39,.92);
  border:1px solid #31516a;border-radius:10px;
  padding:10px 13px;font-size:12px;font-weight:bold;
  cursor:pointer;min-width:76px;box-shadow:0 3px 12px #0007
}
.tool.active{background:#087eaa;border-color:#5de0ff;color:white}
.tool:active{transform:scale(.96)}
#side{
  position:fixed;right:12px;top:88px;width:165px;
  z-index:5;display:grid;gap:8px
}
#side button,#soundButton{
  color:#dff5ff;background:rgba(8,22,36,.88);
  border:1px solid #34536a;border-radius:9px;
  padding:10px;font-size:11px;cursor:pointer
}
#hint{
  position:fixed;left:50%;top:82px;transform:translateX(-50%);
  background:#061522c9;border:1px solid #31546b;
  border-radius:20px;padding:7px 13px;color:#a8c9dc;
  font-size:11px;white-space:nowrap;z-index:5;
  pointer-events:none
}
#soundButton{
  position:fixed;left:12px;bottom:18px;z-index:11;
  background:#07516c;border-color:#55c8ec
}
#crosshair{
  position:fixed;left:50%;top:50%;width:8px;height:8px;
  border:1px solid #a9edff;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;
  opacity:.65;z-index:4
}
@media(max-width:650px){
  #logo{font-size:14px}
  #subtitle{font-size:9px}
  .panel{padding:8px 10px}
  #side{top:75px;right:7px;width:118px;gap:5px}
  #side button{padding:8px 5px;font-size:10px}
  #toolbar{bottom:62px;gap:5px;width:98vw}
  .tool{min-width:65px;padding:9px 7px;font-size:11px}
  #hint{top:70px;font-size:10px;max-width:80vw;white-space:normal;text-align:center}
  #soundButton{bottom:10px;left:10px;padding:8px}
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>

<body>
<div id="game"></div>

<div id="topbar">
  <div class="panel">
    <div id="logo">ALIEN LAB <span style="color:#53d9ff">X</span></div>
    <div id="subtitle">ADVANCED PHYSICS SANDBOX</div>
  </div>
  <div class="panel">
    <div id="status">SYSTEM ONLINE</div>
    <div id="subtitle">LABORATORY 01</div>
  </div>
</div>

<div id="hint">オブジェクトを選択して操作しよう</div>
<div id="crosshair"></div>

<div id="side">
  <button id="newAlien">＋ 新しいエイリアン</button>
  <button id="addBox">＋ 物理ボックス</button>
  <button id="addBall">＋ 金属球</button>
  <button id="gravityButton">重力：ON</button>
  <button id="resetButton">ステージリセット</button>
</div>

<button id="soundButton">🔊 サウンドを有効化</button>

<div id="toolbar">
  <button class="tool active" data-tool="grab">✋ つかむ</button>
  <button class="tool" data-tool="pulse">⚡ パルス</button>
  <button class="tool" data-tool="detach">🧩 分離</button>
  <button class="tool" data-tool="scan">🔍 スキャン</button>
  <button class="tool" data-tool="throw">🚀 投げる</button>
</div>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import * as CANNON from "cannon-es";

/* =========================================================
   ALIEN LAB X - COMPLETE SANDBOX
   Three.js + cannon-es
========================================================= */

const container=document.getElementById("game");
const statusEl=document.getElementById("status");
const hintEl=document.getElementById("hint");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07111c);
scene.fog=new THREE.FogExp2(0x07111c,0.012);

const camera=new THREE.PerspectiveCamera(
  65,window.innerWidth/window.innerHeight,0.1,250
);
camera.position.set(10,8,13);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
container.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.target.set(0,2,0);
controls.maxDistance=27;
controls.minDistance=3;
controls.maxPolarAngle=Math.PI*.49;

const world=new CANNON.World({
  gravity:new CANNON.Vec3(0,-9.82,0)
});
world.broadphase=new CANNON.SAPBroadphase(world);
world.allowSleep=true;
world.solver.iterations=12;
world.solver.tolerance=.001;

const matDefault=new CANNON.Material("default");
const matFloor=new CANNON.Material("floor");
world.defaultContactMaterial=new CANNON.ContactMaterial(
  matDefault,matFloor,{friction:.82,restitution:.08}
);
world.defaultContactMaterial.friction=.55;
world.defaultContactMaterial.restitution=.12;

const clock=new THREE.Clock();
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

let currentTool="grab";
let selected=null;
let grabbedBody=null;
let grabPlane=new THREE.Plane();
let grabOffset=new THREE.Vector3();
let gravityEnabled=true;
let soundEnabled=false;
let audioContext=null;
let masterGain=null;
let alienParts=[];
let alienConstraints=[];
let physicsObjects=[];
let visualObjects=[];
let pulseEffects=[];
let scanEffects=[];
let lastImpactSound=0;
let pointerDown=false;
let activePointerId=null;

const tmpVec=new THREE.Vector3();
const tmpVec2=new THREE.Vector3();

/* ---------------- LIGHTING ---------------- */

scene.add(new THREE.HemisphereLight(0xb8e6ff,0x17202a,1.35));

const mainLight=new THREE.DirectionalLight(0xe2f4ff,2.1);
mainLight.position.set(7,13,8);
mainLight.castShadow=true;
mainLight.shadow.mapSize.set(1024,1024);
mainLight.shadow.camera.left=-18;
mainLight.shadow.camera.right=18;
mainLight.shadow.camera.top=18;
mainLight.shadow.camera.bottom=-18;
scene.add(mainLight);

const cyanLight=new THREE.PointLight(0x22bfff,32,18,2);
cyanLight.position.set(-7,4,-4);
scene.add(cyanLight);

const blueLight=new THREE.PointLight(0x367aff,24,16,2);
blueLight.position.set(7,3,5);
scene.add(blueLight);

/* ---------------- MATERIALS ---------------- */

function physicalMaterial(color,roughness=.6,metalness=.1,extra={}){
  return new THREE.MeshStandardMaterial({
    color,roughness,metalness,...extra
  });
}

const floorMat=physicalMaterial(0x263542,.48,.42);
const wallMat=physicalMaterial(0x344956,.72,.25);
const darkMetal=physicalMaterial(0x111c27,.3,.8);
const silver=physicalMaterial(0x8cabb9,.27,.8);
const glassMat=new THREE.MeshPhysicalMaterial({
  color:0x83dfff,metalness:.05,roughness:.08,
  transmission:.35,transparent:true,opacity:.22,
  thickness:.25,depthWrite:false
});
const glowMat=new THREE.MeshBasicMaterial({color:0x35dfff});

/* ---------------- PHYSICS HELPERS ---------------- */

function addStaticBox(name,x,y,z,sx,sy,sz,material,visible=true){
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),material
  );
  mesh.name=name;
  mesh.position.set(x,y,z);
  mesh.receiveShadow=true;
  mesh.castShadow=true;
  if(visible)scene.add(mesh);

  const body=new CANNON.Body({
    mass:0,
    material:matFloor,
    shape:new CANNON.Box(new CANNON.Vec3(sx/2,sy/2,sz/2))
  });
  body.position.set(x,y,z);
  body.userData={name,staticStage:true};
  world.addBody(body);
  return {mesh,body};
}

function addVisualBox(name,x,y,z,sx,sy,sz,material){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
  mesh.name=name;
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  visualObjects.push(mesh);
  return mesh;
}

/* ---------------- REALISTIC LAB STAGE ---------------- */

function buildLaboratory(){
  // Main room: 22 x 22, ceiling height 8
  addStaticBox("LAB FLOOR",0,-.25,0,22,.5,22,floorMat);
  addStaticBox("NORTH WALL",0,4,-11,22,8,.45,wallMat);
  addStaticBox("SOUTH WALL",0,4,11,22,8,.45,wallMat);
  addStaticBox("WEST WALL",-11,4,0,.45,8,22,wallMat);
  addStaticBox("EAST WALL",11,4,0,.45,8,22,wallMat);
  addStaticBox("CEILING",0,8.25,0,22,.5,22,darkMetal);

  // Floor panels
  for(let x=-10;x<=10;x+=2){
    for(let z=-10;z<=10;z+=2){
      const line=new THREE.Mesh(
        new THREE.BoxGeometry(.025,.012,1.98),
        physicalMaterial(0x526b7a,.5,.35)
      );
      line.position.set(x,.012,z);
      scene.add(line);
    }
  }

  // Wall rails and structural columns
  for(let x=-9;x<=9;x+=3){
    addVisualBox("WALL COLUMN",x,4,-10.72,.13,7.8,.12,darkMetal);
    addVisualBox("WALL COLUMN",x,4,10.72,.13,7.8,.12,darkMetal);
  }

  // Ceiling light strips
  for(let x=-7;x<=7;x+=7){
    const lamp=addVisualBox("CEILING LIGHT",x,7.92,0,3.8,.06,.45,
      new THREE.MeshBasicMaterial({color:0xc9f5ff}));
    const light=new THREE.PointLight(0x9beaff,22,10,2);
    light.position.set(x,7.5,0);
    scene.add(light);
  }

  // Glass containment chamber around the central test area
  const chamberY=2.1;
  addStaticBox("GLASS FRONT",0,chamberY,-4.2,7,4.2,.12,glassMat);
  addStaticBox("GLASS BACK",0,chamberY,4.2,7,4.2,.12,glassMat);
  addStaticBox("GLASS LEFT",-3.5,chamberY,0,.12,4.2,8.4,glassMat);
  addStaticBox("GLASS RIGHT",3.5,chamberY,0,.12,4.2,8.4,glassMat);

  // Chamber metal frame
  for(const x of [-3.55,3.55]){
    for(const z of [-4.25,4.25]){
      addVisualBox("CHAMBER FRAME",x,2.1,z,.16,4.4,.16,silver);
    }
  }
  addVisualBox("CHAMBER TOP FRAME",0,4.3,0,7.2,.16,8.6,silver);
  addVisualBox("CHAMBER BASE FRAME",0,.08,0,7.2,.16,8.6,silver);

  // Laboratory work benches
  for(const z of [-8.3,8.3]){
    addStaticBox("WORK BENCH",0,1.05,z,8,.25,1.2,darkMetal);
    for(const x of [-3.5,3.5]){
      addStaticBox("BENCH LEG",x,.5,z,.18,1,.18,silver);
    }
  }

  // Monitors
  for(const x of [-2.5,0,2.5]){
    const screen=addVisualBox("LAB MONITOR",x,2.15,-8.65,1.65,1,.12,
      new THREE.MeshStandardMaterial({
        color:0x061827,emissive:0x087da8,emissiveIntensity:1.2,
        metalness:.4,roughness:.25
      }));
    const stand=addVisualBox("MONITOR STAND",x,1.55,-8.65,.15,.25,.15,silver);
  }

  // Pipes along the walls
  function pipe(a,b,r,color=0x5e8294){
    const start=new THREE.Vector3(...a);
    const end=new THREE.Vector3(...b);
    const dir=end.clone().sub(start);
    const mesh=new THREE.Mesh(
      new THREE.CylinderGeometry(r,r,dir.length(),12),
      physicalMaterial(color,.32,.8)
    );
    mesh.position.copy(start).add(end).multiplyScalar(.5);
    mesh.quaternion.setFromUnitVectors(
      new THREE.Vector3(0,1,0),dir.normalize()
    );
    mesh.castShadow=true;
    scene.add(mesh);
  }
  pipe([-10,6,-9],[10,6,-9],.12);
  pipe([-10,5.5,9],[10,5.5,9],.09);
  pipe([-9,6,-9],[-9,6,9],.1);
  pipe([9,6,-9],[9,6,9],.1);

  // Warning stripes around test chamber
  for(let i=-3;i<=3;i++){
    addVisualBox("FLOOR WARNING STRIPE",i,.025,-4.65,.42,.018,.08,
      new THREE.MeshBasicMaterial({color:i%2===0?0xffc247:0x17232b}));
    addVisualBox("FLOOR WARNING STRIPE",i,.025,4.65,.42,.018,.08,
      new THREE.MeshBasicMaterial({color:i%2===0?0xffc247:0x17232b}));
  }

  // Small equipment cabinets
  for(const x of [-8.8,8.8]){
    addStaticBox("EQUIPMENT CABINET",x,1.4,0,1.4,2.8,1.3,darkMetal);
    addVisualBox("CABINET PANEL",x,1.65,x<0?.66:-.66,.8,.9,.025,
      new THREE.MeshStandardMaterial({
        color:0x092b3c,emissive:0x087ca0,emissiveIntensity:.7
      }));
  }

  // Ambient floor lights
  for(let x=-9;x<=9;x+=3){
    const strip=addVisualBox("FLOOR LED",x,.035,-10.45,1.2,.025,.08,glowMat);
  }
}

buildLaboratory();
